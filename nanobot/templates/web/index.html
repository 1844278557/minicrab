<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nanobot Web</title>
    <link rel="stylesheet" href="/web/assets/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Nanobot Web</h1>
          <p id="connectionStatus">连接中</p>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="messageInput" rows="1" placeholder="输入消息"></textarea>
        <button id="sendButton" type="submit">发送</button>
      </form>
    </main>
    <script src="/web/assets/app.js"></script>
  </body>
</html>
